services:
  log-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.ingestor
    container_name: log-ingestor
    restart: unless-stopped
    ports:
      - "${INGESTOR_PORT:-8080}:8080"
    networks:
      - logging-net


  fluentbit:
    image: fluent/fluent-bit:latest
    container_name: fluentbit
    restart: always
    command: [ "fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml" ]
    ports:
      - "${FLB_PORT:-24224}:24224"
      # - "2020:2020" # this might be nice if using http
    environment:
      - FLB_LOG_LEVEL
      - FLB_LOG_SERVER_HOST
      - INGESTOR_PORT
      - FLB_LOG_SERVER_API_ENDPOINT
    networks:
      - logging-net
    volumes:
      - ./fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro

networks:
  logging-net:
      external: true

