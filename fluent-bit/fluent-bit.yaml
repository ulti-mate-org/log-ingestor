# Fluent Bit configuration file for log collection and forwarding
#
# This file is part of the ulti-mate organization logging service,
# see: https://ulti-mate.org or https://github.com/ulti-mate-org/logging.git
#
# author: Emiliano Rizzonelli (emiliano.rizzonelli@proton.me)
  
service :
  flush: 5
  grace: 5
  daemon: off
  log_level: ${FLB_LOG_LEVEL}
  parsers_file: parsers.conf # we might want to use a custom parser file
  http_server: off

pipeline:
  inputs:
    - name: forward
      listen: 0.0.0.0
      port: ${FLB_PORT}:24224
      tag: docker.*
  # filters: # note: filters is commented since i need to really understand them before configuring them
  #  - name: grep
  #    match: "docker.*"
  #    regex: "tag backend" # only log from inputs with 'backend.*' tags
  outputs:
    - name: http
      match: docker.*
      host: ${FLB_LOG_SERVER_HOST}
      port: 8080
      uri: ${FLB_LOG_SERVER_API_ENDPOINT}
      format: json_lines
      json_date_key: timestamp
      json_date_format: iso8601
      header: Content-Type application/json
      retry_limit: 5
      tls: off
    - name: stdout
      match: docker.*
      format: json_lines
      json_date_key: timestamp
      json_date_format: iso8601  
